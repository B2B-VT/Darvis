<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darvis</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/logo-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.2, 0.64, 1);
      --maroon: #861F41;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: rgba(134,31,65,0.9); color: #fff; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(134,31,65,0.32); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(134,31,65,0.55); }
    input[type=range] {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #e5e0ea;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #861F41;
      cursor: pointer;
      transition: transform 0.15s var(--ease-out);
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input, textarea, select { font: inherit; }
    button {
      transition:
        transform 0.18s var(--ease-out),
        background 0.2s ease, color 0.2s ease,
        border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    :focus-visible { outline: 2px solid #861F41; outline-offset: 2px; border-radius: 4px; }
    img { user-select: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
